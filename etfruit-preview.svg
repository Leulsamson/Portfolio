  <text x="316" y="172" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ERPNext Core</text>
  <text x="316" y="198" fill="#9FB0A3" font-family="system-ui, sans-serif" font-size="12">Inventory, Sales &amp; Accounting</text>

  <!-- Websocket -->
  <rect x="536" y="112" width="208" height="118" rx="10" fill="#1D2B22" stroke="#354C3B" stroke-width="1.5"/>
  <text x="556" y="144" fill="#B8F34A" font-family="monospace" font-size="11" font-weight="700">NODE.JS · PORT 9000</text>
  <text x="556" y="172" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Socket.IO Realtime</text>
  <text x="556" y="198" fill="#9FB0A3" font-family="system-ui, sans-serif" font-size="12">Live notifications &amp; events</text>

  <!-- Connectors -->
  <path d="M264 171 L296 171" stroke="#B8F34A" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M504 171 L536 171" stroke="#B8F34A" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M400 230 L400 278" stroke="#6B8572" stroke-width="2"/>

  <!-- Workers & Data Layer -->
  <rect x="56" y="278" width="332" height="156" rx="10" fill="#19241D" stroke="#2F4234" stroke-width="1.5"/>
  <text x="76" y="310" fill="#9FB0A3" font-family="monospace" font-size="11" font-weight="700">BACKGROUND WORKERS</text>
  <rect x="76" y="328" width="90" height="36" rx="6" fill="#233328"/>
  <text x="121" y="350" text-anchor="middle" fill="#E5ECE6" font-family="monospace" font-size="11">queue-short</text>
  <rect x="176" y="328" width="90" height="36" rx="6" fill="#233328"/>
  <text x="221" y="350" text-anchor="middle" fill="#E5ECE6" font-family="monospace" font-size="11">queue-long</text>
  <rect x="276" y="328" width="92" height="36" rx="6" fill="#233328"/>
  <text x="322" y="350" text-anchor="middle" fill="#E5ECE6" font-family="monospace" font-size="11">scheduler</text>
  <text x="76" y="402" fill="#9FB0A3" font-family="system-ui, sans-serif" font-size="13">Automated cron jobs, batch processing &amp; async tasks</text>

  <rect x="412" y="278" width="332" height="156" rx="10" fill="#19241D" stroke="#2F4234" stroke-width="1.5"/>
