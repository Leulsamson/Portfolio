  <text x="502" y="350" text-anchor="middle" fill="#B8F34A" font-family="monospace" font-size="11">MariaDB / Sites</text>
  <rect x="584" y="328" width="140" height="36" rx="6" fill="#233328"/>
  <text x="654" y="350" text-anchor="middle" fill="#E5ECE6" font-family="monospace" font-size="11">Redis Cache/Queue</text>
  <text x="432" y="402" fill="#9FB0A3" font-family="system-ui, sans-serif" font-size="13">Multi-container Compose orchestration for EtFruit</text>
