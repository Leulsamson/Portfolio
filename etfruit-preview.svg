<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0F1712"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="#162019" stroke="#2B3D30" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="28" y="28" width="744" height="52" rx="12" fill="#1B2820"/>
  <circle cx="58" cy="54" r="6" fill="#4ADE80"/>
  <circle cx="80" cy="54" r="6" fill="#FACC15"/>
  <circle cx="102" cy="54" r="6" fill="#F87171"/>
  <text x="132" y="59" fill="#E5ECE6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.02em">EtFruit · ERPNext Enterprise Stack</text>
  <rect x="646" y="40" width="106" height="28" rx="14" fill="#243829" stroke="#4D7C0F" stroke-width="1"/>
  <text x="699" y="59" text-anchor="middle" fill="#B8F34A" font-family="monospace" font-size="12" font-weight="700">DOCKERIZED</text>

  <!-- Architecture Nodes -->
  <!-- Frontend -->
  <rect x="56" y="112" width="208" height="118" rx="10" fill="#1D2B22" stroke="#354C3B" stroke-width="1.5"/>
  <text x="76" y="144" fill="#B8F34A" font-family="monospace" font-size="11" font-weight="700">NGINX · PORT 8080</text>
  <text x="76" y="172" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Frappe Frontend</text>
  <text x="76" y="198" fill="#9FB0A3" font-family="system-ui, sans-serif" font-size="12">Reverse proxy &amp; static assets</text>

  <!-- Backend -->
  <rect x="296" y="112" width="208" height="118" rx="10" fill="#1D2B22" stroke="#4D7C0F" stroke-width="1.5"/>
